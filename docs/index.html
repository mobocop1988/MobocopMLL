<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobocop's Master List of Lists</title>

  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-overlay: rgba(10, 15, 29, 0.82);
      --card-bg: rgba(23, 32, 54, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --lime-featured: #a3e635;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0b0f19;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 5rem 1.5rem;
      transition: background-image 0.3s ease-in-out;
    }

    h1.main-title {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-align: center;
      margin-bottom: 2rem;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
      cursor: default;
    }

    /* Discreet Admin Trigger */
    .admin-trigger {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.25);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
      z-index: 1000;
      padding: 0.5rem;
    }

    .admin-trigger:hover {
      color: var(--accent);
      transform: rotate(45deg);
    }

    /* Admin Action Panel */
    .admin-panel {
      display: none;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 2.5rem;
      width: 100%;
      max-width: 900px;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .admin-panel.active {
      display: flex;
    }

    .admin-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      width: 100%;
    }

    .admin-row input[type="text"] {
      flex: 1;
      min-width: 260px;
      padding: 0.6rem 0.8rem;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    button.btn {
      padding: 0.6rem 1.1rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #0b0f19;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button.btn:hover {
      background: var(--accent-hover);
    }

    button.btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    button.btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .status-msg {
      font-size: 0.85rem;
      color: var(--lime-featured);
      font-weight: 600;
    }

    /* Cards Layout */
    .content-wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .featured-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .list-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .featured-card {
      max-width: 440px;
      border: 2px solid var(--lime-featured);
      box-shadow: 0 0 25px rgba(163, 230, 53, 0.25), 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .list-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .list-subject {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .featured-card .list-subject {
      color: var(--lime-featured);
    }

    .delete-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    body.admin-mode .delete-btn {
      display: block;
    }

    .top5-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .top5-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(11, 15, 25, 0.6);
      padding: 0.55rem 0.8rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .featured-card .rank-badge {
      background: var(--lime-featured);
    }

    .list-footer {
      margin-top: 1rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
    }
