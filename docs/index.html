<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobocop's Master List of Lists</title>

  <style>
    :root {
      --bg-overlay: rgba(10, 15, 29, 0.82);
      --card-bg: rgba(23, 32, 54, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --lime-featured: #a3e635;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0b0f19;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 5rem 1.5rem;
      transition: background-image 0.3s ease-in-out;
    }

    h1.main-title {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-align: center;
      margin-bottom: 2rem;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
      cursor: default;
    }

    /* Discreet Admin Trigger */
    .admin-trigger {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.15);
      font-size: 1.25rem;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .admin-trigger:hover {
      color: var(--accent);
      transform: rotate(45deg);
    }

    /* Admin Action Panel */
    .admin-panel {
      display: none;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 2.5rem;
      width: 100%;
      max-width: 900px;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .admin-panel.active {
      display: flex;
    }

    .admin-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      width: 100%;
    }

    .admin-row input[type="text"], .admin-row input[type="password"] {
      flex: 1;
      min-width: 200px;
      padding: 0.6rem 0.8rem;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    button.btn {
      padding: 0.6rem 1.1rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #0b0f19;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button.btn:hover {
      background: var(--accent-hover);
    }

    button.btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    button.btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .status-msg {
      font-size: 0.85rem;
      color: var(--lime-featured);
      font-weight: 600;
    }

    /* Cards Layout */
    .content-wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .featured-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .list-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .featured-card {
      max-width: 440px;
      border: 2px solid var(--lime-featured);
      box-shadow: 0 0 25px rgba(163, 230, 53, 0.25), 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .list-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .list-subject {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .featured-card .list-subject {
      color: var(--lime-featured);
    }

    .delete-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    body.admin-mode .delete-btn {
      display: block;
    }

    .top5-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .top5-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(11, 15, 25, 0.6);
      padding: 0.55rem 0.8rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .featured-card .rank-badge {
      background: var(--lime-featured);
    }

    .list-footer {
      margin-top: 1rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
    }

    .lists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.75rem;
      width: 100%;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #172036;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .modal-content input {
      padding: 0.6rem 0.8rem;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <h1 class="main-title">Mobocop's Master List of Lists</h1>

  <!-- Admin Panel -->
  <div class="admin-panel" id="adminPanel">
    <!-- One-Time GitHub Configuration -->
    <div class="admin-row">
      <input type="text" id="ghRepoInput" placeholder="GitHub Repository (owner/repo-name)">
      <input type="password" id="ghTokenInput" placeholder="GitHub Fine-Grained Token (PAT)">
      <button class="btn btn-secondary" id="saveGhConfigBtn">Save Repo Config</button>
    </div>

    <!-- Background Image Field -->
    <div class="admin-row" style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 0.5rem;">
      <input type="text" id="bgUrlInput" placeholder="Enter new background image URL...">
      <button class="btn" id="setBgBtn">Update Background</button>
      <button class="btn btn-secondary" id="resetBgBtn">Reset</button>
    </div>

    <!-- Actions & Status Indicator -->
    <div class="admin-row" style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 0.5rem;">
      <button class="btn" id="openCustomModalBtn">➕ Create New Top 5 List</button>
      <span class="status-msg" id="syncStatusMsg"></span>
      <button class="btn btn-secondary" id="logoutAdminBtn" style="margin-left: auto;">Lock Admin</button>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="featured-container" id="featuredContainer"></div>
    <div class="lists-grid" id="listsGrid"></div>
  </div>

  <button class="admin-trigger" id="adminTriggerBtn" title="Admin Login">⚙</button>

  <!-- Create List Modal -->
  <div class="modal" id="customModal">
    <div class="modal-content">
      <h3 style="color: var(--accent);">Create New Top 5 List</h3>
      <input type="text" id="customSubject" placeholder="Subject / Category (e.g. Tactical Aircraft)">
      <input type="text" id="item1" placeholder="1. First item">
      <input type="text" id="item2" placeholder="2. Second item">
      <input type="text" id="item3" placeholder="3. Third item">
      <input type="text" id="item4" placeholder="4. Fourth item">
      <input type="text" id="item5" placeholder="5. Fifth item">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeModalBtn">Cancel</button>
        <button class="btn" id="saveCustomListBtn">Save & Sync to GitHub</button>
      </div>
    </div>
  </div>

  <!-- Load External Data Store -->
  <script src="lists.js"></script>

  <script>
    const ADMIN_PASSCODE = "1234";
    let dataStore = window.MOBOCOP_DATA || { background: null, lists: [] };
    let isAdmin = false;

    // Load stored GitHub credentials from local browser storage
    let ghRepo = localStorage.getItem("mobocop_gh_repo") || "";
    let ghToken = localStorage.getItem("mobocop_gh_token") || "";

    function getFormattedCurrentDate() {
      const now = new Date();
      const day = now.getDate();
      const month = now.toLocaleString("en-GB", { month: "long" });
      const year = now.getFullYear();
      return `${day} ${month} ${year}`;
    }

    function applyBackground(url) {
      if (url) {
        document.body.style.backgroundImage = `linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('${url}')`;
        dataStore.background = url;
      } else {
        document.body.style.backgroundImage = "";
        dataStore.background = null;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (dataStore.background) applyBackground(dataStore.background);
      renderAllLists();
      if (ghRepo) document.getElementById("ghRepoInput").value = ghRepo;
      if (ghToken) document.getElementById("ghTokenInput").value = ghToken;
    });

    function renderAllLists() {
      const featuredContainer = document.getElementById("featuredContainer");
      const grid = document.getElementById("listsGrid");

      featuredContainer.innerHTML = "";
      grid.innerHTML = "";

      if (!dataStore.lists || dataStore.lists.length === 0) return;

      // Top-Center Featured Card (Most Recent)
      const featuredCard = createCardElement(dataStore.lists[0], 0, true);
      featuredContainer.appendChild(featuredCard);

      // Remaining Grid Cards
      for (let i = 1; i < dataStore.lists.length; i++) {
        const card = createCardElement(dataStore.lists[i], i, false);
        grid.appendChild(card);
      }
    }

    function createCardElement(listData, index, isFeatured) {
      const card = document.createElement("div");
      card.className = isFeatured ? "list-card featured-card" : "list-card";

      const itemsHtml = listData.items.map((item, i) => `
        <li class="top5-item">
          <span class="rank-badge">${i + 1}</span>
          <span>${item}</span>
        </li>
      `).join("");

      card.innerHTML = `
        <div class="list-card-header">
          <span class="list-subject">${listData.subject}</span>
          <button class="delete-btn" onclick="deleteList(${index})" title="Delete List">&times;</button>
        </div>
        <ul class="top5-items">
          ${itemsHtml}
        </ul>
        <div class="list-footer">
          ${listData.dateAdded || "Added Recently"}
        </div>
      `;

      return card;
    }

    // Direct GitHub REST API Commit Engine
    async function syncToGitHub() {
      const statusEl = document.getElementById("syncStatusMsg");

      if (!ghRepo || !ghToken) {
        statusEl.textContent = "⚠️ Please configure your Repo & Token above.";
        return;
      }

      statusEl.textContent = "⏳ Committing to GitHub...";

      const apiUrl = `https://api.github.com/repos/${ghRepo}/contents/lists.js`;
      const fileContent = `/* ==========================================================================\n   MOBOCOP'S MASTER LIST OF LISTS - PERSISTENT DATA STORE\n   ========================================================================== */\nwindow.MOBOCOP_DATA = ${JSON.stringify(dataStore, null, 2)};\n`;

      try {
        // Step 1: Get latest file SHA
        let currentSha = null;
        const getRes = await fetch(apiUrl, {
          headers: {
            "Authorization": `Bearer ${ghToken}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (getRes.ok) {
          const fileData = await getRes.json();
          currentSha = fileData.sha;
        }

        // Step 2: Push commit to update lists.js
        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${ghToken}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Update lists.js [via Admin Panel]`,
            content: btoa(unescape(encodeURIComponent(fileContent))),
            sha: currentSha || undefined
          })
        });

        if (putRes.ok) {
          statusEl.textContent = "✅ Saved & Committed to GitHub!";
          setTimeout(() => { statusEl.textContent = ""; }, 4000);
        } else {
          const errorData = await putRes.json();
          statusEl.textContent = `❌ Commit error: ${errorData.message || "Check token permissions"}`;
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = "❌ Network connection error.";
      }
    }

    // Save GitHub Config locally
    document.getElementById("saveGhConfigBtn").addEventListener("click", () => {
      ghRepo = document.getElementById("ghRepoInput").value.trim();
      ghToken = document.getElementById("ghTokenInput").value.trim();
      localStorage.setItem("mobocop_gh_repo", ghRepo);
      localStorage.setItem("mobocop_gh_token", ghToken);
      document.getElementById("syncStatusMsg").textContent = "Credentials Saved on this device.";
      setTimeout(() => { document.getElementById("syncStatusMsg").textContent = ""; }, 3000);
    });

    // Admin Mode Handlers
    const adminTriggerBtn = document.getElementById("adminTriggerBtn");
    const adminPanel = document.getElementById("adminPanel");
    const logoutAdminBtn = document.getElementById("logoutAdminBtn");

    adminTriggerBtn.addEventListener("click", () => {
      if (!isAdmin) {
        const pass = prompt("Enter Admin Passcode:");
        if (pass === ADMIN_PASSCODE) {
          isAdmin = true;
          document.body.classList.add("admin-mode");
          adminPanel.classList.add("active");
          adminTriggerBtn.style.display = "none";
        } else if (pass !== null) {
          alert("Incorrect passcode.");
        }
      }
    });

    logoutAdminBtn.addEventListener("click", () => {
      isAdmin = false;
      document.body.classList.remove("admin-mode");
      adminPanel.classList.remove("active");
      adminTriggerBtn.style.display = "block";
    });

    // Background Controls
    document.getElementById("setBgBtn").addEventListener("click", () => {
      if (!isAdmin) return;
      const url = document.getElementById("bgUrlInput").value.trim();
      if (url) {
        applyBackground(url);
        document.getElementById("bgUrlInput").value = "";
        syncToGitHub();
      }
    });

    document.getElementById("resetBgBtn").addEventListener("click", () => {
      if (!isAdmin) return;
      applyBackground(null);
      syncToGitHub();
    });

    // Modal & Add List Controls
    const modal = document.getElementById("customModal");
    document.getElementById("openCustomModalBtn").addEventListener("click", () => {
      if (!isAdmin) return;
      modal.style.display = "flex";
      document.getElementById("customSubject").focus();
    });

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      modal.style.display = "none";
    });

    document.getElementById("saveCustomListBtn").addEventListener("click", () => {
      if (!isAdmin) return;
      const subject = document.getElementById("customSubject").value.trim() || "Untitled List";
      const items = [
        document.getElementById("item1").value.trim() || "Item 1",
        document.getElementById("item2").value.trim() || "Item 2",
        document.getElementById("item3").value.trim() || "Item 3",
        document.getElementById("item4").value.trim() || "Item 4",
        document.getElementById("item5").value.trim() || "Item 5"
      ];

      dataStore.lists.unshift({
        subject: subject,
        items: items,
        dateAdded: getFormattedCurrentDate()
      });

      renderAllLists();
      syncToGitHub();

      document.getElementById("customSubject").value = "";
      for (let i = 1; i <= 5; i++) document.getElementById(`item${i}`).value = "";
      modal.style.display = "none";
    });

    window.deleteList = function(index) {
      if (!isAdmin) return;
      if (confirm(`Delete "${dataStore.lists[index].subject}"?`)) {
        dataStore.lists.splice(index, 1);
        renderAllLists();
        syncToGitHub();
      }
    };
  </script>
</body>
</html>
