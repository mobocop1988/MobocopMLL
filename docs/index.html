<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobocop's Master List of Lists</title>

  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --default-bg: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80');
      --bg-overlay: rgba(10, 15, 29, 0.82);
      --card-bg: rgba(23, 32, 54, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --lime-featured: #a3e635;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0b0f19;
      background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), var(--default-bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 5rem 1.5rem;
      transition: background-image 0.3s ease-in-out;
    }

    h1.main-title {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-align: center;
      margin-bottom: 2rem;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
      cursor: default;
    }

    /* Admin Trigger Gear Icon */
    .admin-trigger {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      color: var(--text-muted);
      font-size: 1.35rem;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 1000;
    }

    .admin-trigger:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: rotate(45deg);
    }

    /* Admin Action Panel */
    .admin-panel {
      display: none;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 2.5rem;
      width: 100%;
      max-width: 900px;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .admin-panel.active {
      display: flex;
    }

    .admin-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      width: 100%;
    }

    .admin-row input[type="text"] {
      flex: 1;
      min-width: 260px;
      padding: 0.6rem 0.8rem;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    button.btn {
      padding: 0.6rem 1.1rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #0b0f19;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button.btn:hover {
      background: var(--accent-hover);
    }

    button.btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    button.btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .status-msg {
      font-size: 0.85rem;
      color: var(--lime-featured);
      font-weight: 600;
    }

    /* Cards Layout */
    .content-wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .featured-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .list-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .featured-card {
      max-width: 440px;
      border: 2px solid var(--lime-featured);
      box-shadow: 0 0 25px rgba(163, 230, 53, 0.25), 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .list-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .list-subject {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .featured-card .list-subject {
      color: var(--lime-featured);
    }

    .delete-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    body.admin-mode .delete-btn {
      display: block;
    }

    .top5-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .top5-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(11, 15, 25, 0.6);
      padding: 0.55rem 0.8rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .featured-card .rank-badge {
      background: var(--lime-featured);
    }

    .list-footer {
      margin-top: 1rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
    }

    .lists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.75rem;
      width: 100%;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-content {
      background: #172036;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .modal-content input {
      padding: 0.6rem 0.8rem;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <h1 class="main-title">Mobocop's Master List of Lists</h1>

  <!-- Admin Panel -->
  <div class="admin-panel" id="adminPanel">
    <!-- Background Image Field -->
    <div class="admin-row">
      <input type="text" id="bgUrlInput" placeholder="Enter new background image URL...">
      <button class="btn" id="setBgBtn">Update & Save Background</button>
      <button class="btn btn-secondary" id="resetBgBtn">Reset to Default</button>
    </div>

    <!-- Actions & Status -->
    <div class="admin-row" style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 0.5rem;">
      <button class="btn" id="openCustomModalBtn">➕ Create New Top 5 List</button>
      <span class="status-msg" id="syncStatusMsg"></span>
      <button class="btn btn-secondary" id="logoutAdminBtn" style="margin-left: auto;">Lock Admin</button>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="featured-container" id="featuredContainer"></div>
    <div class="lists-grid" id="listsGrid"></div>
  </div>

  <!-- Admin Trigger Gear -->
  <button class="admin-trigger" id="adminTriggerBtn" title="Admin Login (or Ctrl+Shift+A)">⚙</button>

  <!-- Create List Modal -->
  <div class="modal" id="customModal">
    <div class="modal-content">
      <h3 style="color: var(--accent);">Create New Top 5 List</h3>
      <input type="text" id="customSubject" placeholder="Subject / Category (e.g. Favorite Sci-Fi Movies)">
      <input type="text" id="item1" placeholder="1. First item">
      <input type="text" id="item2" placeholder="2. Second item">
      <input type="text" id="item3" placeholder="3. Third item">
      <input type="text" id="item4" placeholder="4. Fourth item">
      <input type="text" id="item5" placeholder="5. Fifth item">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeModalBtn">Cancel</button>
        <button class="btn" id="saveCustomListBtn">Save List</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       SUPABASE CONFIGURATION
       ========================================================================== */
    const SUPABASE_URL = "https://tozmfbneiasmnxbftlqw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvem1mYm5laWFzbW54YmZ0bHF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNzAzMjUsImV4cCI6MjEwMzk0NjMyNX0.-Z6w_lYZ9kmRtUWLK93XHP1aRUEd0NlEYM0qLvZWtNw";
    const ADMIN_PASSCODE = "1234";

    let dbClient = null;
    if (window.supabase && SUPABASE_URL.startsWith("http")) {
      dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let listsData = [];
    let isAdmin = false;

    function getFormattedCurrentDate() {
      const now = new Date();
      const day = now.getDate();
      const month = now.toLocaleString("en-GB", { month: "long" });
      const year = now.getFullYear();
      return `${day} ${month} ${year}`;
    }

    function applyBackground(url) {
      if (url && url.trim() !== '') {
        document.body.style.backgroundImage = `linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('${url}')`;
      } else {
        document.body.style.backgroundImage = "linear-gradient(var(--bg-overlay), var(--bg-overlay)), var(--default-bg)";
      }
    }

    // Load initial data
    window.addEventListener("DOMContentLoaded", async () => {
      if (dbClient) {
        await loadBackground();
        await fetchLists();
      } else {
        listsData = [
          {
            id: 1,
            subject: "Supabase Connection Pending",
            items: ["Open index.html", "Paste your SUPABASE_URL", "Paste your SUPABASE_ANON_KEY", "Save index.html and push to GitHub", "Refresh to manage live database"],
            date_added: getFormattedCurrentDate()
          }
        ];
        renderAllLists();
      }
    });

    async function loadBackground() {
      try {
        const { data, error } = await dbClient
          .from('site_settings')
          .select('value')
          .eq('key', 'background_url')
          .maybeSingle();

        if (!error && data && data.value) {
          applyBackground(data.value);
        }
      } catch (e) {
        console.warn("Background load skipped:", e);
      }
    }

    async function fetchLists() {
      try {
        const { data, error } = await dbClient
          .from('top5_lists')
          .select('*')
          .order('id', { ascending: false });

        if (error) {
          console.error("Fetch lists error:", error);
          alert("Supabase error fetching lists: " + error.message);
          return;
        }

        if (data) {
          listsData = data;
          renderAllLists();
        }
      } catch (e) {
        console.warn("Could not fetch lists:", e);
      }
    }

    function renderAllLists() {
      const featuredContainer = document.getElementById("featuredContainer");
      const grid = document.getElementById("listsGrid");

      featuredContainer.innerHTML = "";
      grid.innerHTML = "";

      if (listsData.length === 0) return;

      // Top-Center Featured (Most Recent)
      const featuredCard = createCardElement(listsData[0], true);
      featuredContainer.appendChild(featuredCard);

      // Remaining Grid Cards
      for (let i = 1; i < listsData.length; i++) {
        const card = createCardElement(listsData[i], false);
        grid.appendChild(card);
      }
    }

    function createCardElement(listData, isFeatured) {
      const card = document.createElement("div");
      card.className = isFeatured ? "list-card featured-card" : "list-card";

      const itemsHtml = listData.items.map((item, i) => `
        <li class="top5-item">
          <span class="rank-badge">${i + 1}</span>
          <span>${item}</span>
        </li>
      `).join("");

      card.innerHTML = `
        <div class="list-card-header">
          <span class="list-subject">${listData.subject}</span>
          <button class="delete-btn" onclick="deleteList(${listData.id})" title="Delete List">&times;</button>
        </div>
        <ul class="top5-items">
          ${itemsHtml}
        </ul>
        <div class="list-footer">
          ${listData.date_added || "Added Recently"}
        </div>
      `;

      return card;
    }

    // Admin Authentication Handlers
    const adminTriggerBtn = document.getElementById("adminTriggerBtn");
    const adminPanel = document.getElementById("adminPanel");
    const logoutAdminBtn = document.getElementById("logoutAdminBtn");

    function promptAdminLogin() {
      if (!isAdmin) {
        const pass = prompt("Enter Admin Passcode:");
        if (pass === ADMIN_PASSCODE) {
          isAdmin = true;
          document.body.classList.add("admin-mode");
          adminPanel.classList.add("active");
          adminTriggerBtn.style.display = "none";
        } else if (pass !== null) {
          alert("Incorrect passcode.");
        }
      }
    }

    adminTriggerBtn.addEventListener("click", promptAdminLogin);

    // Keyboard Shortcut Failsafe: Ctrl+Shift+A / Cmd+Shift+A
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        promptAdminLogin();
      }
    });

    logoutAdminBtn.addEventListener("click", () => {
      isAdmin = false;
      document.body.classList.remove("admin-mode");
      adminPanel.classList.remove("active");
      adminTriggerBtn.style.display = "flex";
    });

    // Background Handlers (Persisted to Supabase)
    document.getElementById("setBgBtn").addEventListener("click", async () => {
      if (!isAdmin) return;
      const url = document.getElementById("bgUrlInput").value.trim();
      if (!url) return;

      applyBackground(url);
      if (dbClient) {
        const { error } = await dbClient
          .from('site_settings')
          .upsert({ key: 'background_url', value: url });

        if (error) {
          alert("Supabase background save error: " + error.message);
        } else {
          document.getElementById("syncStatusMsg").textContent = "✅ Background saved to Supabase!";
          setTimeout(() => { document.getElementById("syncStatusMsg").textContent = ""; }, 3000);
        }
      }
      document.getElementById("bgUrlInput").value = "";
    });

    document.getElementById("resetBgBtn").addEventListener("click", async () => {
      if (!isAdmin) return;
      applyBackground("");
      if (dbClient) {
        await dbClient.from('site_settings').upsert({ key: 'background_url', value: '' });
      }
    });

    // Modal & Add List Controls
    const modal = document.getElementById("customModal");
    document.getElementById("openCustomModalBtn").addEventListener("click", () => {
      if (!isAdmin) return;
      modal.style.display = "flex";
      document.getElementById("customSubject").focus();
    });

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      modal.style.display = "none";
    });

    document.getElementById("saveCustomListBtn").addEventListener("click", async () => {
      if (!isAdmin) return;
      const subject = document.getElementById("customSubject").value.trim() || "Untitled List";
      const items = [
        document.getElementById("item1").value.trim() || "Item 1",
        document.getElementById("item2").value.trim() || "Item 2",
        document.getElementById("item3").value.trim() || "Item 3",
        document.getElementById("item4").value.trim() || "Item 4",
        document.getElementById("item5").value.trim() || "Item 5"
      ];

      const newList = {
        subject: subject,
        items: items,
        date_added: getFormattedCurrentDate()
      };

      if (dbClient) {
        const { data, error } = await dbClient.from('top5_lists').insert([newList]).select();
        if (error) {
          alert("Error saving list to Supabase: " + error.message);
          return;
        }
        if (data && data.length > 0) {
          listsData.unshift(data[0]);
          renderAllLists();
        }
      } else {
        listsData.unshift({ id: Date.now(), ...newList });
        renderAllLists();
      }

      document.getElementById("customSubject").value = "";
      for (let i = 1; i <= 5; i++) document.getElementById(`item${i}`).value = "";
      modal.style.display = "none";
    });

    window.deleteList = async function(id) {
      if (!isAdmin) return;
      if (confirm(`Delete this list?`)) {
        if (dbClient) {
          const { error } = await dbClient.from('top5_lists').delete().eq('id', id);
          if (error) {
            alert("Error deleting list: " + error.message);
            return;
          }
        }
        listsData = listsData.filter(item => item.id !== id);
        renderAllLists();
      }
    };
  </script>
</body>
</html>
